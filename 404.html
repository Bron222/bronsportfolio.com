<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <title>Page not found | Bron Whitten</title>
    <meta name="theme-color" content="#07090f">
    <!-- Absolute paths, because this page is shown for any missing URL -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg__grid"></div>
        <div class="bg__blob bg__blob--1"></div>
        <div class="bg__blob bg__blob--2"></div>
        <div class="bg__blob bg__blob--3"></div>
    </div>

    <main class="notfound container">
        <p class="notfound__code gradient-text">404</p>
        <h1 class="notfound__title">This page doesn't exist.</h1>
        <p class="notfound__text">The link may be mistyped or out of date.</p>
        <a class="btn btn--primary" href="/">Back to home</a>
    </main>
</body>
</html>
